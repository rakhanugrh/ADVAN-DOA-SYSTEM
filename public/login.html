<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin QC - ADVAN DOA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border p-8">
    <div class="text-center mb-6">
      <div class="w-full bg-[#E6007E] py-4 px-2 rounded-xl mb-4 flex justify-center items-center shadow-sm">
        <img src="https://lowkerjakarta.id/wp-content/uploads/2025/05/Lowkerjakarta-Logo-Advan.jpg" alt="ADVAN Logo" class="h-10 object-contain rounded-md">
      </div>
      <h1 class="text-xl font-bold text-gray-800">Admin Login Portal</h1>
      <p class="text-xs text-gray-500 mt-1">Sistem Approval Klaim Garansi DOA Advan</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Username Admin</label>
        <input type="text" id="username" placeholder="Masukkan username" class="w-full border p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" class="w-full border p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" required>
      </div>

      <div id="errorMsg" class="hidden p-3 rounded-lg bg-red-50 text-red-700 text-xs font-semibold border border-red-200"></div>

      <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold text-sm shadow transition">
        Masuk Ke Dashboard Admin
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');

      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memverifikasi...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await res.json();

        if (result.success) {
          window.location.href = '/admin.html';
        } else {
          errorMsg.innerText = result.message;
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.innerText = "Tidak dapat terhubung ke server.";
        errorMsg.classList.remove('hidden');
      } finally {
        btn.innerText = "Masuk Ke Dashboard Admin";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
