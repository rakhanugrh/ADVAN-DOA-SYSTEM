<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin QC - ADVAN DOA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 400px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .logo { text-align: center; margin-bottom: 25px; }
    .logo h2 { color: #38bdf8; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
    .logo p { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #cbd5e1; font-size: 14px; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .alert { padding: 10px; background: #991b1b; color: #fecaca; font-size: 13px; border-radius: 6px; margin-bottom: 15px; display: none; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <h2>ADVAN DOA</h2>
      <p>Portal Login Admin Quality Control</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="formLogin">
      <div class="form-group">
        <label for="username">Username Admin</label>
        <input type="text" id="username" required placeholder="Masukkan username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Masukkan password">
      </div>
      <button type="submit" id="btnSubmit">Masuk Admin</button>
    </form>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnSubmit');

      alertBox.style.display = 'none';
      btn.innerText = 'Memverifikasi...';
      btn.disabled = true;

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.username);
          window.location.href = '/admin.html';
        } else {
          alertBox.innerText = data.message;
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'Gagal terhubung ke server.';
        alertBox.style.display = 'block';
      } finally {
        btn.innerText = 'Masuk Admin';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
