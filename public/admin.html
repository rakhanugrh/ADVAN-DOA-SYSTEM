<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard QC DOA - ADVAN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 20px; color: #38bdf8; }
    header p { font-size: 12px; color: #94a3b8; }
    .nav-btns { display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-refresh { background: #0284c7; color: white; }
    .btn-logout { background: #ef4444; color: white; }

    .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; }
    
    .sidebar { width: 320px; background: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; height: calc(100vh - 110px); overflow-y: auto; }
    .sidebar-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .badge-count { background: #334155; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

    .ticket-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .ticket-card:hover, .ticket-card.active { border-color: #38bdf8; background: #1e293b; }
    .ticket-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; font-weight: bold; }
    .ticket-name { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .ticket-unit { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    
    .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    .status-pending { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b; }
    .status-approved { background: #10b98122; color: #34d399; border: 1px solid #10b981; }
    .status-rejected { background: #ef444422; color: #f87171; border: 1px solid #ef4444; }

    .content-area { flex: 1; background: #1e293b; border-radius: 8px; padding: 25px; border: 1px solid #334155; display: flex; flex-direction: column; }
    .empty-state { margin: auto; text-align: center; color: #64748b; font-size: 14px; }

    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
    .detail-item label { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-item div { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-top: 2px; }

    .action-bar { display: flex; gap: 10px; margin-top: auto; padding-top: 15px; border-top: 1px solid #334155; }
    .btn-approve { background: #10b981; color: white; flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
    .btn-reject { background: #ef4444; color: white; flex: 1; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
    .btn-approve:hover { background: #059669; }
    .btn-reject:hover { background: #dc2626; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Dashboard Approval QC DOA</h1>
      <p>Advan Service Center Internal Portal</p>
    </div>
    <div class="nav-btns">
      <button class="btn btn-refresh" onclick="loadTickets()">🔄 Refresh Data</button>
      <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar List Tiket -->
    <div class="sidebar">
      <div class="sidebar-title">
        <span>DAFTAR KLAIM</span>
        <span class="badge-count" id="ticketCount">0</span>
      </div>
      <div id="ticketList">
        <!-- List tiket akan dimuat di sini -->
      </div>
    </div>

    <!-- Area Detail Tiket -->
    <div class="content-area" id="contentArea">
      <div class="empty-state">
        👈 Pilih salah satu customer dari daftar di sebelah kiri untuk melihat detail klaim.
      </div>
    </div>
  </div>

  <script>
    let ticketsData = [];
    let selectedTicketNo = null;

    async function loadTickets() {
      try {
        const res = await fetch('/api/doa/tickets');
        if (res.status === 401 || res.status === 403) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();
        if (data.success) {
          ticketsData = data.tickets || [];
          renderTicketList();
          if (selectedTicketNo) {
            const current = ticketsData.find(t => t.no_tiket === selectedTicketNo);
            if (current) renderDetail(current);
          }
        }
      } catch (err) {
        console.error('Gagal mengambil data:', err);
      }
    }

    function renderTicketList() {
      const listContainer = document.getElementById('ticketList');
      document.getElementById('ticketCount').innerText = ticketsData.length;
      listContainer.innerHTML = '';

      if (ticketsData.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:20px;">Belum ada klaim masuk.</div>';
        return;
      }

      ticketsData.forEach(t => {
        const statusClass = t.status === 'Approved' ? 'status-approved' : (t.status === 'Rejected' ? 'status-rejected' : 'status-pending');
        
        const card = document.createElement('div');
        card.className = `ticket-card ${selectedTicketNo === t.no_tiket ? 'active' : ''}`;
        card.onclick = () => {
          selectedTicketNo = t.no_tiket;
          renderTicketList();
          renderDetail(t);
        };

        card.innerHTML = `
          <div class="ticket-header">
            <span>${t.no_tiket}</span>
            <span class="status-badge ${statusClass}">${t.status || 'Pending'}</span>
          </div>
          <div class="ticket-name">${t.nama || '-'}</div>
          <div class="ticket-unit">${t.kategori || ''} - ${t.tipe_unit || '-'}</div>
        `;
        listContainer.appendChild(card);
      });
    }

    function renderDetail(t) {
      const container = document.getElementById('contentArea');
      const statusClass = t.status === 'Approved' ? 'status-approved' : (t.status === 'Rejected' ? 'status-rejected' : 'status-pending');

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2>Detail Tiket: ${t.no_tiket}</h2>
          <span class="status-badge ${statusClass}" style="font-size:12px; padding:5px 12px;">${t.status || 'Pending'}</span>
        </div>

        <div class="detail-grid">
          <div class="detail-item"><label>Nama Pemohon</label><div>${t.nama || '-'}</div></div>
          <div class="detail-item"><label>Perusahaan / Dealer</label><div>${t.perusahaan || '-'}</div></div>
          <div class="detail-item"><label>Email</label><div>${t.email || '-'}</div></div>
          <div class="detail-item"><label>No. WhatsApp</label><div>${t.nowa || '-'}</div></div>
          <div class="detail-item"><label>Kategori Perangkat</label><div>${t.kategori || '-'}</div></div>
          <div class="detail-item"><label>Tipe / Model Unit</label><div>${t.tipe_unit || '-'}</div></div>
          <div class="detail-item"><label>Serial Number (SN)</label><div>${t.sn_unit || '-'}</div></div>
          <div class="detail-item"><label>Tanggal Pengajuan</label><div>${t.created_at ? new Date(t.created_at).toLocaleString('id-ID') : '-'}</div></div>
        </div>

        <div style="background:#0f172a; padding:15px; border-radius:8px; border:1px solid #334155; margin-bottom:20px;">
          <label style="display:block; font-size:11px; color:#94a3b8; text-transform:uppercase; margin-bottom:5px;">Detail Kendala DOA</label>
          <div style="font-size:14px; color:#e2e8f0; line-height:1.5;">${t.keluhan || '-'}</div>
        </div>

        <div class="action-bar">
          <button class="btn-approve" onclick="processAction('${t.no_tiket}', 'approve')">✔ Approve Klaim</button>
          <button class="btn-reject" onclick="processAction('${t.no_tiket}', 'reject')">✖ Reject Klaim</button>
        </div>
      `;
    }

    async function processAction(noTiket, action) {
      if (!confirm(`Apakah Anda yakin ingin ${action === 'approve' ? 'MENERIMA' : 'MENOLAK'} klaim ini?`)) return;

      try {
        const res = await fetch('/api/doa/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ noTiket, action })
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message);
          loadTickets();
        } else {
          alert(data.message || 'Gagal mengubah status.');
        }
      } catch (err) {
        alert('Terjadi kesalahan sistem.');
      }
    }

    async function logout() {
      document.cookie = "admin_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      window.location.href = '/login.html';
    }

    // Auto load data saat awal dibuka
    loadTickets();
  </script>
</body>
</html>
