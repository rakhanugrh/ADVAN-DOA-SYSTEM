<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard QC DOA - ADVAN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { background: #1e293b; padding: 15px 30px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; color: #38bdf8; }
    header p { font-size: 12px; color: #94a3b8; }
    
    .btn-logout { background: #ef4444; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-logout:hover { background: #dc2626; }

    .main-container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }
    
    .sidebar { width: 350px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h3 { font-size: 15px; color: #f8fafc; }
    .badge-count { background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }

    .ticket-list { overflow-y: auto; flex: 1; padding: 10px; }
    .ticket-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .ticket-item:hover, .ticket-item.active { border-color: #38bdf8; background: #1e293b; }
    .ticket-item h4 { font-size: 14px; color: #f8fafc; margin-bottom: 4px; }
    .ticket-item p { font-size: 12px; color: #94a3b8; margin-bottom: 2px; }
    .ticket-item .tag { display: inline-block; background: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-top: 4px; }

    .content { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; overflow-y: auto; }
    .empty-state { text-align: center; color: #64748b; margin-top: 100px; }

    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
    .detail-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .detail-box label { font-size: 11px; color: #64748b; display: block; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .detail-box span { font-size: 14px; color: #f8fafc; word-break: break-all; }

    .media-container { margin-top: 15px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
    .media-grid img, .media-grid video { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #334155; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Dashboard Approval QC DOA</h1>
      <p>Advan Service Center Internal Portal</p>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>DAFTAR KLAIM</h3>
        <span class="badge-count" id="ticketCount">0</span>
      </div>
      <div class="ticket-list" id="ticketList">
        <div style="text-align:center; color:#64748b; padding:20px;">Memuat data...</div>
      </div>
    </div>

    <div class="content" id="detailContent">
      <div class="empty-state">
        👈 Pilih salah satu customer dari daftar di sebelah kiri untuk melihat detail klaim.
      </div>
    </div>
  </div>

  <script>
    let ticketsData = [];

    // Proteksi Sederhana Login
    if (sessionStorage.getItem('adminLoggedIn') !== 'true') {
      window.location.href = '/login.html';
    }

    function logout() {
      sessionStorage.removeItem('adminLoggedIn');
      window.location.href = '/login.html';
    }

    async function loadTickets() {
      try {
        const res = await fetch('/api/admin/tickets');
        const result = await res.json();

        if (result.success) {
          ticketsData = result.tickets || [];
          renderTicketList();
        }
      } catch (err) {
        console.error('Error fetching tickets:', err);
      }
    }

    function renderTicketList() {
      const listEl = document.getElementById('ticketList');
      const countEl = document.getElementById('ticketCount');
      
      countEl.innerText = ticketsData.length;

      if (ticketsData.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">Belum ada klaim masuk.</div>';
        return;
      }

      listEl.innerHTML = ticketsData.map((t, idx) => `
        <div class="ticket-item" onclick="showDetail(${idx})">
          <h4>${t.nama || 'Tanpa Nama'}</h4>
          <p>SN: ${t.sn_unit || '-'}</p>
          <p>Tipe: ${t.tipe_unit || '-'}</p>
          <span class="tag">${t.no_tiket || 'DOA-000000'}</span>
        </div>
      `).join('');
    }

    function showDetail(index) {
      const t = ticketsData[index];
      const detailEl = document.getElementById('detailContent');

      const files = typeof t.files === 'string' ? JSON.parse(t.files || '[]') : (t.files || []);

      let mediaHtml = '';
      if (files && files.length > 0) {
        mediaHtml = `
          <div class="media-container">
            <h4 style="font-size:13px; color:#cbd5e1; margin-bottom:8px;">Lampiran Media (${files.length})</h4>
            <div class="media-grid">
              ${files.map(f => f.resource_type === 'video' ? 
                `<video src="${f.url}" controls></video>` : 
                `<a href="${f.url}" target="_blank"><img src="${f.url}"></a>`
              ).join('')}
            </div>
          </div>
        `;
      }

      detailEl.innerHTML = `
        <h2 style="color:#38bdf8; font-size:18px; margin-bottom:20px;">Detail Tiket: ${t.no_tiket}</h2>
        <div class="detail-grid">
          <div class="detail-box"><label>Nama Pelanggan</label><span>${t.nama || '-'}</span></div>
          <div class="detail-box"><label>Perusahaan / Dealer</label><span>${t.perusahaan || '-'}</span></div>
          <div class="detail-box"><label>Email</label><span>${t.email || '-'}</span></div>
          <div class="detail-box"><label>No. WhatsApp</label><span>${t.nowa || '-'}</span></div>
          <div class="detail-box"><label>Kota / Kabupaten</label><span>${t.kota || '-'}</span></div>
          <div class="detail-box"><label>Jenis & Tipe Unit</label><span>${t.kategori || ''} - ${t.tipe_unit || ''}</span></div>
          <div class="detail-box"><label>Serial Number (SN)</label><span>${t.sn_unit || '-'}</span></div>
          <div class="detail-box"><label>Tanggal Pengajuan</label><span>${new Date(t.created_at).toLocaleString('id-ID')}</span></div>
        </div>
        <div class="detail-box" style="margin-bottom:15px;">
          <label>Alamat Pengiriman</label>
          <span>${t.alamat || '-'}</span>
        </div>
        <div class="detail-box" style="margin-bottom:15px;">
          <label>Keluhan / Kendala</label>
          <span>${t.keluhan || '-'}</span>
        </div>
        ${mediaHtml}
      `;
    }

    // Auto-sync refresh setiap 5 detik
    loadTickets();
    setInterval(loadTickets, 5000);
  </script>
</body>
</html>
