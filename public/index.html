<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pengajuan Klaim Garansi DOA - ADVAN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 650px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    
    .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
    .header img { max-width: 160px; height: auto; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
    .header h2 { color: #ffffff; font-size: 20px; font-weight: 700; }
    .header p { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; text-align: center; line-height: 1.4; }
    .alert-danger { background-color: #450a0a; border: 1px solid #991b1b; color: #fecaca; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    input[type="file"] { width: 100%; padding: 10px; background-color: #0f172a; border: 1px dashed #334155; border-radius: 6px; color: #94a3b8; cursor: pointer; }
    .file-hint { font-size: 12px; color: #64748b; margin-top: 4px; }
    
    button { width: 100%; padding: 14px; background-color: #0284c7; border: none; border-radius: 6px; color: #ffffff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
    button:hover { background-color: #0369a1; }
    button:disabled { background-color: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="/advan_logo1.png" alt="Logo ADVAN" onerror="this.onerror=null; this.src='/advan_logo1.png';">
      <h2>Formulir Pengajuan Klaim Garansi DOA</h2>
      <p>Sistem Pelayanan Garansi Dead on Arrival</p>
    </div>

    <div id="alertError" class="alert alert-danger"></div>

    <form id="formDOA">
      <div class="form-group">
        <label for="nama">Nama Lengkap *</label>
        <input type="text" id="nama" required placeholder="Contoh: Rakha Nugraha">
      </div>

      <div class="form-group">
        <label for="perusahaan">Perusahaan / Dealer</label>
        <input type="text" id="perusahaan" placeholder="Contoh: Erajaya / Toko Jaya">
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>

      <div class="form-group">
        <label for="nowa">No. WhatsApp *</label>
        <input type="text" id="nowa" required placeholder="081234567890">
      </div>

      <!-- 1. JENIS BARANG -->
      <div class="form-group">
        <label for="jenisBarang">1. Jenis Perangkat / Barang *</label>
        <select id="jenisBarang" required>
          <option value="">-- Pilih Jenis Barang --</option>
          <option value="Laptop">Laptop</option>
          <option value="Smartphone">Smartphone / HP</option>
          <option value="Tablet">Tablet</option>
          <option value="PC AIO">PC All-in-One (AIO)</option>
          <option value="Lainnya">Lainnya / Aksesoris</option>
        </select>
      </div>

      <!-- 2. VARIAN DETAIL BARANG -->
      <div class="form-group">
        <label for="variantBarang">2. Varian / Seri Barang Detail *</label>
        <input type="text" id="variantBarang" required placeholder="Contoh: Workplus 14 Ryzen 5 / Tab VX Pro 8GB">
      </div>

      <div class="form-group">
        <label for="snUnit">Serial Number (SN) Unit *</label>
        <input type="text" id="snUnit" required placeholder="Masukkan SN unit">
      </div>

      <!-- KENDALA DIKETIK BEBAS -->
      <div class="form-group">
        <label for="keluhan">Deskripsi Kendala / Keluhan *</label>
        <textarea id="keluhan" rows="4" required placeholder="Tuliskan detail kendala atau kerusakan unit saat diterima..."></textarea>
      </div>

      <!-- KOLOM FOTO TERPISAH -->
      <div class="form-group">
        <label for="fotoFiles">Lampiran Foto Bukti Kendala</label>
        <input type="file" id="fotoFiles" multiple accept="image/*">
        <p class="file-hint">* Format: JPG, PNG, WEBP (Bisa pilih beberapa foto).</p>
      </div>

      <!-- KOLOM VIDEO TERPISAH -->
      <div class="form-group">
        <label for="videoFiles">Lampiran Video Bukti Kendala (Unboxing / Unit Mati)</label>
        <input type="file" id="videoFiles" accept="video/*">
        <p class="file-hint">* Format: MP4, MOV, AVI (Video besar ter-compress otomatis).</p>
      </div>

      <button type="submit" id="btnSubmit">Kirim Pengajuan Klaim</button>
    </form>
  </div>

  <script>
    document.getElementById('formDOA').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alertError = document.getElementById('alertError');
      const btnSubmit = document.getElementById('btnSubmit');
      
      if (alertError) alertError.style.display = 'none';
      btnSubmit.innerText = 'Mengunggah Media & Memproses...';
      btnSubmit.disabled = true;

      try {
        const fotoInput = document.getElementById('fotoFiles');
        const videoInput = document.getElementById('videoFiles');
        
        const filesToUpload = [];
        if (fotoInput && fotoInput.files) {
          for (let f of fotoInput.files) filesToUpload.push(f);
        }
        if (videoInput && videoInput.files) {
          for (let v of videoInput.files) filesToUpload.push(v);
        }

        const uploadedMedia = [];

        // Direct Signed Upload ke Cloudinary
        if (filesToUpload.length > 0) {
          const sigRes = await fetch('/api/doa/cloudinary-signature');
          if (!sigRes.ok) throw new Error('Gagal mendapatkan token izin upload server.');
          const sigData = await sigRes.json();

          for (let i = 0; i < filesToUpload.length; i++) {
            const file = filesToUpload[i];
            const formData = new FormData();
            
            formData.append('file', file);
            formData.append('api_key', sigData.api_key);
            formData.append('timestamp', sigData.timestamp);
            formData.append('signature', sigData.signature);
            formData.append('folder', sigData.folder);
            formData.append('transformation', sigData.transformation);

            const cloudRes = await fetch(
              `https://api.cloudinary.com/v1_1/${sigData.cloud_name}/auto/upload`,
              { method: 'POST', body: formData }
            );

            const cloudData = await cloudRes.json();
            
            if (cloudData.secure_url) {
              uploadedMedia.push({
                url: cloudData.secure_url,
                public_id: cloudData.public_id,
                resource_type: cloudData.resource_type,
                created_at: new Date()
              });
            } else {
              throw new Error('Gagal upload file ke cloud: ' + (cloudData.error?.message || 'Error tidak diketahui'));
            }
          }
        }

        const payload = {
          nama: document.getElementById('nama').value,
          perusahaan: document.getElementById('perusahaan').value || '',
          email: document.getElementById('email').value,
          nowa: document.getElementById('nowa').value,
          kategori: document.getElementById('jenisBar
