<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengajuan Klaim Garansi DOA - ADVAN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; width: 100%; max-width: 650px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 30px; }
    .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    .header h1 { color: #e91e63; font-size: 24px; margin-bottom: 5px; }
    .header p { color: #666; font-size: 14px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #2563eb; }
    .note { font-size: 11px; color: #888; margin-top: 4px; }
    .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .btn-submit:hover { background: #1d4ed8; }
    .alert { padding: 12px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
    .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>ADVAN DOA SYSTEM</h1>
      <p>Formulir Pengajuan Klaim Garansi DOA (Dead on Arrival)</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="doaForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" name="nama" required placeholder="Masukkan nama pemohon">
      </div>

      <div class="form-group">
        <label>Perusahaan / Dealer</label>
        <input type="text" name="perusahaan" placeholder="Nama toko / perusahaan (opsional)">
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="contoh@email.com">
      </div>

      <div class="form-group">
        <label>No. WhatsApp *</label>
        <input type="tel" name="nowa" required placeholder="081234567890">
      </div>

      <div class="form-group">
        <label>Pilih Model / Tipe Unit *</label>
        <select name="tipeUnit" required>
          <option value="">-- Pilih Tipe Unit --</option>
          <option value="Workpro (Intel i5)">Workpro (Intel i5)</option>
          <option value="Workplus (AMD Ryzen)">Workplus (AMD Ryzen)</option>
          <option value="Soulmate">Soulmate</option>
          <option value="AIO PC Series">AIO PC Series</option>
        </select>
      </div>

      <div class="form-group">
        <label>Serial Number (SN) *</label>
        <input type="text" name="snUnit" required placeholder="Masukkan SN unit">
      </div>

      <div class="form-group">
        <label>Detail Kendala DOA *</label>
        <textarea name="keluhan" required placeholder="Jelaskan detail kerusakan unit..."></textarea>
      </div>

      <div class="form-group">
        <label>Upload Bukti Foto/Lampiran (Maksimal 4MB total) *</label>
        <input type="file" name="files" multiple required accept="image/*">
        <div class="note">* Pilih foto ukuran ringan agar tidak melebihi batas upload.</div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Kirim Pengajuan Klaim DOA</button>
    </form>
  </div>

  <script>
    const doaForm = document.getElementById('doaForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    doaForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      btnSubmit.innerText = 'Mengirim Data...';
      btnSubmit.disabled = true;

      const formData = new FormData(doaForm);

      try {
        // Menggunakan path relatif agar langsung menembak ke Vercel Serverless
        const response = await fetch('/api/doa/submit', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = `<b>Berhasil!</b> ${data.message}<br>Nomor Tiket Anda: <b>${data.noTiket}</b>`;
          alertBox.style.display = 'block';
          doaForm.reset();
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.innerText = data.message || 'Gagal mengirim pengajuan.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerHTML = '<b>KONEKSI ERROR!</b><br>Tidak dapat terhubung ke server atau ukuran file terlalu besar.';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.innerText = 'Kirim Pengajuan Klaim DOA';
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
